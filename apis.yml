aid: squads
name: Squads
description: >-
  Squads Labs builds smart-account and stablecoin infrastructure on Solana. Its
  flagship Squads Protocol is an open-source, formally-verified, immutable
  multisig program (v3 and v4) that secures over $10 billion in on-chain assets
  for 350+ teams, exposed to developers through the @sqds/multisig TypeScript SDK,
  a Rust crate, and the @sqds/cli command-line tool. Squads also operates Grid, a
  stablecoin API for accounts, payments, cards, and yield that lets fintech
  developers build neobank-style products on stablecoin rails with sub-second
  settlement. This profile was seeded as a VC-portfolio lead and enriched by the
  API Evangelist pipeline from Squads' public developer surface.
